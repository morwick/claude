/* ============ design tokens ============ */
:root{
  --char:#121317; --char2:#1B1C21; --ink:#15161A; --ink2:#5E6270; --ink3:#8B8F9A;
  --line:#E9E9EC; --paper:#F5F4F0; --off:#F4F4F1;
  --acc:#4B5FE0; --acc2:#7A5AE0; --accSoft:#EEF0FC;
  --green:#1F9D63; --amber:#C98A1B; --red:#CF4B4B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0C0D10}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#0C0D10;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.L{position:absolute;left:0;top:0;width:1080px;height:1920px}
.abs{position:absolute}
.row{display:flex;align-items:center}
.J{font-family:Jakarta,sans-serif}
.tn{font-variant-numeric:tabular-nums}

/* ============ backgrounds ============ */
#bgDark{background:radial-gradient(80% 55% at 50% 42%,#1C1E24 0%,#111216 55%,#0B0C0F 100%)}
#dots{background-image:radial-gradient(rgba(255,255,255,.075) 1.6px,transparent 1.8px);background-size:36px 36px;
  -webkit-mask-image:radial-gradient(70% 55% at 50% 55%,#000 30%,transparent 100%)}
#bgLight{background:linear-gradient(180deg,#F6F5F1 0%,#F1EFEA 58%,#E7E4DD 100%)}
#bgLight::after{content:'';position:absolute;inset:0;background:radial-gradient(90% 50% at 50% 38%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%)}
#spot{background:radial-gradient(46% 26% at 50% 48%,rgba(120,130,200,.16),rgba(0,0,0,0) 100%)}
#fade{background:#000;opacity:0}

/* ============ headline system ============ */
.hl{position:absolute;left:90px;top:292px;width:900px}
.hl .ln{display:block;overflow:hidden;padding:4px 0 10px;margin-bottom:-14px}
.hl .ln>span{display:inline-block;white-space:nowrap;will-change:transform}
.H{font:800 92px/0.98 Jakarta;letter-spacing:-2.5px;text-transform:uppercase}
.dk{color:#F4F4F1} .lt{color:#121317}
.pd{color:var(--acc)}
.eyebrow{font:600 22px Inter;letter-spacing:5px;text-transform:uppercase}
.svcName{font:700 94px/1 Jakarta;letter-spacing:-3px;color:#121317}

#cam1{transform-style:preserve-3d;transform-origin:540px 1110px}
#sq{position:absolute;border:3px solid #D6D8DF;border-radius:6px}

#win .pbgwf{position:absolute;inset:0;border-radius:18px;border:3px solid #5F636E}

.red{position:absolute;background:#F2548E;opacity:0}

.k-cta{height:100%;background:#15161A;border-radius:20px;padding:50px 56px;color:#fff}

.k-form{height:100%;background:#fff;border-radius:14px;padding:24px}
.k-in{height:48px;border:1px solid #E3E3E7;border-radius:10px;margin-bottom:12px;display:flex;align-items:center;padding:0 16px;font:400 15px Inter;color:#8B8F9A}
.k-foot{height:100%;border-top:1px solid #EFEFF1;display:flex;align-items:center;padding:0 80px;font:400 14.5px Inter;color:#8B8F9A}

.st{position:absolute;top:0;width:0;height:0;perspective:1900px}
.rig{position:absolute;left:0;top:0;transform-style:preserve-3d}
.dev{position:absolute;transform-style:preserve-3d}
.scr{position:absolute;overflow:hidden;background:#fff}
.ui{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#fff;font-family:Inter;color:#15161A}
.glare{position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.03) 34%,rgba(255,255,255,0) 35%)}

/* phone */
.ph-body{position:absolute;inset:0;background:#1A1B1E;box-shadow:inset 0 0 0 2.5px #6E7078,inset 0 0 0 5px #0B0B0C,0 60px 90px -40px rgba(20,18,30,.55),0 24px 40px -24px rgba(0,0,0,.35)}
.island{position:absolute;left:50%;top:24px;width:118px;height:34px;margin-left:-59px;border-radius:17px;background:#050506}
/* laptop */
.lid{position:absolute;background:#141518;border-radius:24px 24px 6px 6px;box-shadow:inset 0 0 0 2px #8D9097,inset 0 0 0 4px #0A0A0B,0 50px 80px -40px rgba(20,18,30,.45)}
.lbase{position:absolute;border-radius:2px 2px 30px 30px/2px 2px 14px 14px;background:linear-gradient(180deg,#E3E4E8 0%,#C9CBD0 35%,#9EA1A8 100%);box-shadow:0 30px 40px -18px rgba(20,18,30,.45)}

.cam{position:absolute;left:50%;top:8px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#26282E}
/* monitor */
.mon{position:absolute;background:#141518;border-radius:18px;box-shadow:inset 0 0 0 2px #8D9097,inset 0 0 0 4px #0A0A0B,0 50px 80px -40px rgba(20,18,30,.45)}
.neck{position:absolute;background:linear-gradient(90deg,#B9BCC2,#E2E3E7 45%,#AFB2B8)}
.foot{position:absolute;border-radius:10px;background:linear-gradient(180deg,#E4E5E8,#B4B7BD);box-shadow:0 20px 30px -12px rgba(20,18,30,.4)}
/* tablet */
.tab{position:absolute;inset:0;border-radius:46px;background:#16171A;box-shadow:inset 0 0 0 3px #B8BBC2,inset 0 0 0 5px #0B0B0C,0 60px 90px -40px rgba(20,18,30,.5)}

/* ============ generic UI kit ============ */
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 32px;font:600 15px Inter}
.pill{display:inline-flex;align-items:center;border-radius:999px}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font:600 12px Inter}
.b-g{background:#E7F5EE;color:#1F8A58}.b-a{background:#FBF1DF;color:#A8700F}.b-r{background:#FBE9E9;color:#B23C3C}.b-n{background:#EFEFF2;color:#6A6E79}.b-b{background:#ECEFFC;color:#3F52C9}.b-p{background:#F1ECFB;color:#6A48C8}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font:600 12px Inter;flex:none}
.card{background:#fff;border:1px solid #ECECEF;border-radius:14px}
.mut{color:#7A7E89}
.input{display:flex;align-items:center;gap:10px;border:1px solid #E3E3E7;border-radius:10px;background:#fff;color:#8B8F9A}

/* responsive site */
.rs{position:absolute;left:0;top:0;height:1200px;background:#fff;overflow:hidden}
.rs .b{position:absolute}
.rs-nav{display:flex;align-items:center;height:100%;border-bottom:1px solid #EFEFF1;background:#fff}
.rs-links{display:flex;gap:24px;font:500 14px Inter;color:#6A6E79;margin-left:auto;margin-right:22px}
.rs-h1{font:700 40px/1.07 Jakarta;letter-spacing:-1.3px;margin:14px 0 16px}
.rs-p{font:400 15px/1.6 Inter;color:#666A76;margin-bottom:22px}
.rs-card{height:100%;background:#fff;border:1px solid #EAEAED;border-radius:14px;padding:22px}
.rs-card h4{font:700 18px Jakarta;letter-spacing:-.3px;margin:18px 0 8px}
.rs-card p{font:400 13.5px/1.55 Inter;color:#6A6E79}
.rs-menu{position:absolute;right:0;top:0;bottom:0;width:78%;background:#fff;box-shadow:-30px 0 60px -20px rgba(0,0,0,.25);padding:90px 28px 0}
.rs-menu div{font:700 26px Jakarta;letter-spacing:-.6px;padding:14px 0;border-bottom:1px solid #F0F0F2}

/* ============ scene 4 browser ============ */
#rb{position:absolute;background:#fff;overflow:hidden}
#rbChrome{position:absolute;left:0;top:0;right:0;background:#F2F2F0;border-bottom:1px solid #E6E6E4;overflow:hidden}
#rbView{position:absolute;left:0;right:0;bottom:0;overflow:hidden;background:#fff}
#handle{position:absolute;width:10px;height:74px;border-radius:5px;background:#9EA1AA}

.tap{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(20,22,30,.18);border:2px solid rgba(255,255,255,.8);opacity:0}

/* ============ scene 5 / 6 ============ */
.tile{position:absolute;width:440px;height:300px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -24px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}
#logo{position:absolute;left:0;top:0;display:flex;align-items:flex-end;white-space:nowrap}
.lgm{overflow:hidden;padding:0 4px 26px}
.lgm span{display:inline-block;font:800 196px/1 Jakarta;letter-spacing:-7px;color:#EFEFEC}
#lgI span{font-weight:700;color:#EFEFEC}
#lgDot{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#5A6DF0,#7A5AE0);margin:0 6px 46px 4px;flex:none}
#tag{position:absolute;left:0;width:1080px;text-align:center;font:600 28px Inter;letter-spacing:6px;color:#9DA1AE;white-space:nowrap}
#ctaH{position:absolute;left:0;width:1080px;top:560px;text-align:center}
#ctaH .ln{display:block;overflow:hidden;padding:4px 0 10px;margin-bottom:-14px}
#ctaH .ln>span{display:inline-block;font:800 86px/1 Jakarta;letter-spacing:-2.5px;color:#F4F4F1}
#free{position:absolute;left:0;width:1080px;top:830px;display:flex;justify-content:center;align-items:center;gap:22px;font:600 36px Inter;color:#C9CCD6}
#free i{display:block;width:70px;height:2px;background:#3A3D46}
#wa{position:absolute;left:115px;top:960px;width:850px;height:176px;border-radius:88px;background:#F4F4F1;display:flex;align-items:center;padding:0 48px 0 30px;gap:34px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
#waIc{position:relative;width:116px;height:116px;flex:none}

#waTx b{display:block;font:700 72px/1.05 Inter;letter-spacing:.5px;color:#121317;margin-top:6px}
</style>
</head>

  <!-- SCENE 1 + 2 : shape -> wireframe -> website -> exploded layers -->
  <div class="L" id="s12"><div class="L" id="cam1"><div id="sq"></div><div id="win"></div></div></div>

  <!-- SCENE 3 : service carousel (world) -->

  <!-- SCENE 4 : responsive -->
  <div class="L" id="s4"><div class="L" id="s4cam"></div></div>

  <!-- SCENE 5 / 6 : brand + CTA -->
  <div class="L" id="s5"><div class="L" id="grid5" style="perspective:2200px;perspective-origin:540px 1000px"></div></div>

<script>
/* =========================================================
   helpers
   ========================================================= */
const $ = s => document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const mix=(a,b,k)=>a+(b-a)*k;
const E={
  lin:x=>x,
  outCubic:x=>1-Math.pow(1-x,3), inCubic:x=>x*x*x,
  inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  outQuint:x=>1-Math.pow(1-x,5), inQuint:x=>x*x*x*x*x,
  inOutQuint:x=>x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2,
  outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  outBack:x=>{const c1=1.35,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  // cubic-bezier(.2,.8,.2,1)-like "designer" ease
  snap:x=>1-Math.pow(1-x,4),
};
const P=(t,a,b,e=E.outCubic)=>t<=a?0:t>=b?1:e((t-a)/(b-a));
const vis=(el,on)=>{el.style.display=on?'':'none'};
const css=(el,o)=>{for(const k in o) el.style[k]=o[k]};

/* line icons (24 grid) */
const IP={

  grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  chart:'<path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17.5 14.2c2.4.3 3.7 2 4 4.8"/>',

  file:'<path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  cog:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.9 1.9M16.6 16.6l1.9 1.9M5.5 18.5l1.9-1.9M16.6 7.4l1.9-1.9"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  bell:'<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.8 1.8H4.2z"/><path d="M10 21h4"/>',
  cart:'<path d="M3 4h2.6l2.3 11h10.4l2-7.6H7"/><circle cx="9.5" cy="19.3" r="1.4"/><circle cx="17" cy="19.3" r="1.4"/>',
  bag:'<path d="M5.5 8h13l-1 12.5h-11z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',

  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  layers:'<path d="M12 3.5 21 8.5l-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',

  sofa:'<path d="M4 11V8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3"/><path d="M3 12.5a2 2 0 0 1 4 0V15h10v-2.5a2 2 0 0 1 4 0V19H3z"/>',

function series(n,seed,base,amp){const a=[];for(let i=0;i<n;i++){a.push(base+amp*(0.55*Math.sin(i*.42+seed)+0.3*Math.sin(i*1.13+seed*2)+0.25*Math.sin(i*.19+seed*.5))+i*amp*.035)}return a}
function pathOf(arr,w,h,mn,mx,close=false){const pts=arr.map((v,i)=>[i*w/(arr.length-1),h-(v-mn)/(mx-mn)*h]);
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){const p0=pts[i-1],p1=pts[i],cx=(p0[0]+p1[0])/2;d+=` C${cx.toFixed(1)} ${p0[1].toFixed(1)},${cx.toFixed(1)} ${p1[1].toFixed(1)},${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`}
  if(close) d+=` L${w} ${h} L0 ${h}Z`; return d;}

  if(W>=640){A=LAY.T;B=LAY.D;k=(W-640)/320}else{A=LAY.M;B=LAY.T;k=(W-380)/260}

function lines(el,t,tin,tout,{st=.07,dur=.55,odur=.35,dir=1}={}){

    const a=P(t,tin+i*st,tin+i*st+dur,E.outQuint), b=P(t,tout+i*st*.6,tout+i*st*.6+odur,E.inCubic);
    const y=(1-a)*112 - b*112*dir;
    s.style.transform=`translateY(${y}%)`;

}

let LOGO={};
function render(t){
  const bgL=P(t,5.75,6.25,E.inOutCubic)*(1-P(t,14.95,15.5,E.inOutCubic));
  $('#bgLight').style.opacity=bgL;
  $('#dots').style.opacity=(1-P(t,5.6,6.1))*0.9*P(t,0,.6) + P(t,15.4,16.4)*0.35*(1-P(t,17.3,17.8));
  $('#spot').style.opacity=P(t,15.8,16.6);
  const fo=P(t,19.62,20.0,E.inCubic); $('#fade').style.opacity=fo;

  /* ---------------- SCENE 1 (0–3) + SCENE 2 (3–6.2) ---------------- */
  const s12=t<6.22; vis($('#s12'),s12);
  if(s12){
    const cam=mix(0.9,1.0,P(t,0,3.0,E.inOutCubic));
    $('#cam1').style.transform=`scale(${cam})`;
    // geometric seed -> window outline
    const sq=$('#sq');
    const a0=P(t,0.04,0.34,E.outBack), m=P(t,0.34,0.86,E.inOutQuint);
    const w=mix(30,845,m), hh=mix(30,1190,P(t,0.40,0.92,E.inOutQuint));
    css(sq,{width:w+'px',height:hh+'px',left:(540-w/2)+'px',top:(1110-hh/2)+'px',
      transform:`scale(${a0}) rotate(${45*(1-m)}deg)`,opacity:1-P(t,0.9,1.0),borderRadius:mix(6,12,m)+'px',
      background:`rgba(255,255,255,${0.9*(1-P(t,0.2,0.5))})`});
    vis(sq,t<1.05);
    // explode factor
    const ex=P(t,3.0,3.95,E.inOutCubic)*(1-P(t,5.05,5.8,E.inOutCubic));
    const orbit=P(t,3.2,5.4,E.lin);
    const ax=50*ex, az=(-30+8*orbit)*ex, ay=0;
    const tilt=12*(1-P(t,0.5,2.2,E.inOutCubic));             // subtle scene-1 perspective settle
    const sc=0.66*mix(1,0.64,ex);
    // final dock to laptop screen (window top 515 -> 736)
    const dock=P(t,5.3,5.95,E.inOutCubic);
    const ty=mix(0,221,dock)+(30*ex);
    const win=$('#win');
    win.style.transform=`translate3d(${30*ex}px,${ty}px,0) scale(${sc}) rotateX(${ax+tilt}deg) rotateZ(${az}deg)`;
    win.style.setProperty('--e',ex);
    win.style.clipPath=t>5.3?`inset(0 0 ${(1804-800)*P(t,5.3,5.9,E.inOutCubic)}px 0 round ${18}px)`:'none';
    // wireframe -> polished
    const pb=P(t,1.15,1.55);
    $('#pbg').style.opacity=pb; $('#pbgwf').style.opacity=P(t,0.84,0.9)*(1-P(t,1.2,1.5));
    KB.forEach((b,i)=>{
      const el=$('#B_'+b.id);
      const wfi=P(t,0.72+i*0.03,0.98+i*0.03), wfo=P(t,1.25+i*0.045,1.55+i*0.045);
      const ci=P(t,1.28+i*0.05,1.72+i*0.05,E.outQuint);
      const z=b.z*ex*2.1;
      el.style.transform=`translateZ(${z}px)`;
      el.children[2].style.opacity=wfi*(1-wfo);
      el.children[1].style.opacity=ci; el.children[1].style.transform=`translateY(${(1-ci)*18}px)`;
      el.children[0].style.opacity=ex*.9;
    });
    // selection states (Figma-like)
    const selA=(id,a,b)=>{$('#S_'+id).style.opacity=P(t,a,a+.12)*(1-P(t,b,b+.12))};
    selA('hImg',3.95,4.55); selA('hBtn',4.35,4.95); selA('c2',4.7,5.1);
    const rd=P(t,4.72,4.85)*(1-P(t,5.1,5.2));
    ['rd1','rd2','rdl1','rdl2'].forEach(id=>$('#'+id).style.opacity=rd);
    // primary button: style refinement while selected
    const pr=P(t,4.45,4.75);
    $('#kBtnPri').style.background=`rgb(${mix(21,75,pr)|0},${mix(22,95,pr)|0},${mix(26,224,pr)|0})`;
    if(t<3) $('#kBtnPri').style.background='';
  }

  /* ---------------- SCENE 3 (6–11) service carousel ---------------- */
  const s3=t>=5.85&&t<11.5; vis($('#s3'),s3);
  const pans=[[6.66,7.06],[7.5,7.9],[8.35,8.75],[9.2,9.6],[10.0,10.4],[10.82,11.3]];
  let p=0; pans.forEach(([a,b])=>p+=P(t,a,b,E.inOutCubic));
  const camX=540+p*1150;
  if(s3){
    const zoomIn=P(t,5.85,6.3,E.outCubic);
    $('#s3').style.opacity=t<6.2?P(t,5.95,6.2):1;
    $('#world').style.transform=`translateX(${-(camX-540)}px)`;
    for(let i=0;i<6;i++){
      const d=(SX[i]-camX)/1150, ad=Math.abs(d);
      const st=$('#st'+i); vis(st,ad<1.2);
      if(ad>=1.2) continue;
      const lift=0;
      $('#rig'+i).style.transform=`translate3d(${d*-60}px,${lift}px,${-ad*260}px) rotateY(${-d*24}deg)`;
      $('#cs'+i).style.opacity=(1-ad)*(i==0?P(t,5.9,6.3):1);
      st.style.opacity=1-P(ad,0.75,1.15,E.lin);
    }
    // station 0: laptop site scrolls
    $('#lapSite').style.transform=`translateY(${-P(t,6.3,6.95,E.inOutCubic)*560}px)`;
    // station 1: add to cart tap
    const tapT=7.28, tp=$('#tap1');
    tp.style.left=(SX[1]-camX+540 + (-186+22+179+151+16)*372/390 + 13 - (camX-540)*0 )+'px';
    const tapX=SX[1] + (-199+13) + (22+179+151)*372/390, tapY=1080 + (-416+13) + (414+146+10+18+16+30)*372/390;
    css(tp,{left:tapX+'px',top:tapY+'px',opacity:P(t,tapT-.08,tapT)*(1-P(t,tapT+.1,tapT+.35)),transform:`scale(${mix(.6,1.25,P(t,tapT-.08,tapT+.35))})`});
    const ok=P(t,tapT,tapT+.12);
    const add=$('#add1'); add.style.background=ok>0.5?'#C8643B':'#2A1D16'; add.style.transform=`scale(${1-0.14*Math.sin(Math.PI*P(t,tapT-.05,tapT+.15,E.lin))})`;
    add.querySelector('[data-k=plus]').style.opacity=1-ok; add.querySelector('[data-k=ok]').style.opacity=ok;
    const bd=$('#cartBadge'); bd.textContent=t>=tapT+.1?'2':'1'; bd.style.transform=`scale(${1+0.35*Math.sin(Math.PI*P(t,tapT+.08,tapT+.3,E.lin))})`;
    const sb=P(t,tapT+.08,tapT+.3);
    document.querySelector('#shopBar .sbA').style.cssText+=`;opacity:${1-sb};transform:translateY(${-sb*12}px)`;
    document.querySelector('#shopBar .sbB').style.cssText+=`;opacity:${sb};transform:translateY(${(1-sb)*12}px)`;
    // station 2: dashboard animations
    const dk=P(t,7.6,8.4,E.inOutCubic);
    $('#dashClipR').setAttribute('width',(638*mix(0.15,1,dk)).toFixed(1));
    $('#dashDot').style.opacity=P(t,8.25,8.4); $('#dashTip').style.opacity=P(t,8.28,8.42);
    $('#dashTip').style.transform=`translateY(${(1-P(t,8.28,8.45))*8}px)`;
    document.querySelectorAll('#dashUI .catBar').forEach((b,i)=>b.style.width=(b.dataset.v*2*P(t,7.75+i*.05,8.3+i*.05,E.outCubic))+'%');
    const tst=P(t,8.05,8.35,E.outBack); $('#toast').style.transform=`translateX(${(1-tst)*380}px)`; $('#toast').style.opacity=P(t,8.05,8.15);
    // station 3: search typing + highlight
    const q='Dewi', nq=Math.floor(clamp((t-8.72)/0.09,0,4));
    $('#sisQ').textContent=q.slice(0,nq); $('#sisPh').style.display=nq?'none':'';
    $('#sisCaret').style.opacity=(Math.floor(t*4)%2||nq<4)?1:0; $('#sisCaret').style.marginLeft=nq?'-8px':'-8px';
    const hi=P(t,9.12,9.3);
    document.querySelectorAll('#sisUI .empRow').forEach(r=>{const me=r.dataset.i==2;r.style.opacity=me?1:1-0.6*hi;r.style.background=me?`rgba(75,95,224,${0.08*hi})`:''});
    // station 4: drag kanban card to Review
    const dg=P(t,9.72,10.12,E.inOutCubic), lift4=P(t,9.62,9.75)*(1-P(t,10.12,10.22));
    const kd=$('#kDrag'); kd.style.position='relative'; kd.style.zIndex=5;
    kd.style.transform=`translate(${dg*260}px,${-dg*44}px) rotate(${3*lift4}deg) scale(${1+0.04*lift4})`;
    kd.style.boxShadow=`0 ${24*lift4}px ${40*lift4}px -12px rgba(20,22,40,${.35*lift4})`;
    const slot=$('#kSlot'); slot.style.height=(P(t,9.7,9.95)*118)+'px'; slot.style.marginBottom=(P(t,9.7,9.95)*12)+'px'; slot.style.opacity=P(t,9.7,9.9)*(1-P(t,10.1,10.15));
    // station 5: landing scroll + CTA press
    $('#landScroll').style.transform=`translateY(${-P(t,10.35,10.95,E.inOutCubic)*250}px)`;
    const lp=P(t,10.72,10.8)*(1-P(t,10.8,10.95));
    $('#landBtn').style.transform=`scale(${1-0.04*lp})`;
  }

  /* service labels */
  const svcOn=t>6.05&&t<11.25; vis($('#svcHead'),svcOn);
  if(svcOn){
    const bounds=[6.1,6.86,7.7,8.55,9.4,10.2,11.02];
    const hdIn=P(t,6.1,6.5,E.outQuint), hdOut=P(t,10.95,11.2,E.inCubic);
    const row=$('#svcHead').firstElementChild;
    row.style.opacity=hdIn*(1-hdOut); row.style.transform=`translateY(${(1-hdIn)*20}px)`;
    $('#svcRule').style.width=(80*hdIn)+'px';
    let cur=0; for(let i=0;i<6;i++) if(t>=bounds[i]-.02) cur=i;
    $('#svcNum').textContent=`0${cur+1} / 06`;
    for(let i=0;i<6;i++){
      const a=P(t,bounds[i]-.02,bounds[i]+.4,E.outQuint), b=P(t,bounds[i+1]-.18,bounds[i+1]+.08,E.inCubic);
      $('#svc'+i).style.transform=`translateY(${(1-a)*115-b*115}%)`;
      $('#svc'+i).parentElement.style.display=(a>0&&b<1)?'':'none';
    }
  }

  /* ---------------- SCENE 4 (11–15) responsive ---------------- */
  const s4=t>=10.8&&t<15.6; vis($('#s4'),s4);
  if(s4){
    $('#s4').style.transform=`translateX(${SX[6]-camX}px)`;
    $('#s4').style.opacity=1-P(t,15.05,15.45);
    // browser width: 960 -> 640 -> 380
    const Wb=960-320*P(t,11.5,12.15,E.inOutCubic)-260*P(t,12.3,12.9,E.inOutCubic);
    const ph=P(t,12.95,13.35,E.inOutCubic);        // browser -> phone
    const Hb=mix(1000,822,ph), chH=mix(40,44,ph);
    const comp=P(t,13.15,13.85,E.inOutCubic);       // pull back into multi-device composition
    const rb=$('#rb');
    const cx=mix(540,790,comp), cy=mix(1110,1272,comp), sc=mix(1,0.62,comp);
    css(rb,{width:Wb+'px',height:Hb+'px',left:(540-Wb/2)+'px',top:(1110-Hb/2)+'px',borderRadius:mix(14,48,ph)+'px',
      transform:`translate(${cx-540}px,${cy-1110}px) scale(${sc})`,
      boxShadow:`0 0 0 ${13*ph}px #1A1B1E, 0 0 0 ${15.5*ph}px #6E7078, 0 60px 90px -40px rgba(20,18,30,.5)`});
    $('#rbChrome').style.height=chH+'px'; $('#rbCh').style.opacity=1-ph; $('#rbSB').style.opacity=ph;
    $('#rbView').style.top=chH+'px'; $('#rbIsland').style.opacity=ph;
    rsApply($('#rsMain'),Wb);
    // handle + cursor drag
    const hx=540+Wb/2+10, hvis=P(t,11.2,11.4)*(1-P(t,12.9,13.05));
    css($('#handle'),{left:(hx-5)+'px',top:(1110-37)+'px',opacity:hvis});
    const cin=P(t,11.15,11.5,E.outCubic);
    css($('#cur4'),{left:(hx+6+(1-cin)*120)+'px',top:(1116+(1-cin)*80)+'px',opacity:hvis});
    // menu on phone
    const mn=P(t,13.95,14.35,E.outQuint);
    $('#rsMenu').style.transform=`translateX(${(1-mn)*105}%)`; $('#rsDim').style.opacity=mn;
    // tablet + monitor enter
    const tb=P(t,13.3,13.95,E.outQuint), mo=P(t,13.4,14.05,E.outQuint);
    const orbit=P(t,13.5,15.4,E.lin);
    css($('#s4tab'),{opacity:tb,transform:`translate(${(1-tb)*-160}px,${(1-tb)*40}px)`});
    $('#s4tab').firstElementChild.style.transform=`rotateY(${8-6*orbit}deg)`;
    css($('#s4mon'),{opacity:mo,transform:`translateY(${(1-mo)*90}px) scale(${mix(.92,1,mo)})`});
    $('#s4mon').firstElementChild.style.transform=`rotateY(${-4+5*orbit}deg)`;
    // tablet card hover (touch)
    const hv=P(t,14.15,14.35)*(1-P(t,14.9,15.1));
    const tcard=$('#rsTab').querySelector('[data-k="cc1"]');
    tcard.style.transform=`translateY(${-8*hv}px)`; tcard.style.boxShadow=`0 ${22*hv}px ${36*hv}px -14px rgba(20,22,40,${.3*hv})`; tcard.style.borderColor=hv>.5?'#C9CFF5':'#EAEAED';
    // monitor cursor hover on primary button
    const c4=P(t,14.0,14.45,E.inOutCubic);
    css($('#cur4b'),{opacity:P(t,13.95,14.1),left:mix(560,145,c4)+'px',top:mix(360,286,c4)+'px'});
    const hb=P(t,14.45,14.6);
    $('#rsMon').querySelector('[data-k="pri"]').style.background=`rgb(${mix(75,52,hb)|0},${mix(95,70,hb)|0},${mix(224,190,hb)|0})`;
  }
  // words
  const WO={odur:.2};
  lines($('#w1'),t,11.12,11.58,WO); lines($('#w2'),t,11.8,12.25,WO); lines($('#w3'),t,12.46,12.92,WO);
  lines($('#w4'),t,13.13,13.58,WO); lines($('#w5'),t,13.8,14.95,{st:.08});

  /* headlines scene 1/2 */
  lines($('#h1a'),t,0.22,1.42,{st:.09}); lines($('#h1b'),t,1.6,2.85,{st:.09}); lines($('#h2'),t,3.3,5.55,{st:.09});

  /* ---------------- SCENE 5 (15–17.4) brand ---------------- */
  const s5=t>=15.0; vis($('#s5'),s5);
  if(s5){
    const TW=440,TH=300,G=28, gx0=540-TW-G/2, gy0=1030-(3*TH+2*G)/2;
    const pull=P(t,15.0,16.0,E.outCubic);
    $('#gridIn').style.transform=`translateY(${mix(60,0,pull)}px) rotateX(${mix(24,10,pull)}deg) rotateZ(${mix(-10,-4,pull)}deg) scale(${mix(1.12,0.9,pull)})`;
    $('#gridIn').style.transformOrigin='540px 1030px';
    const dot=LOGO.dot;
    for(let i=0;i<6;i++){
      const el=$('#t'+i), col=i%2, rowi=Math.floor(i/2);
      const x=gx0+col*(TW+G), y=gy0+rowi*(TH+G);
      const a=P(t,15.02+i*0.06,15.62+i*0.06,E.outQuint);
      const c=P(t,15.92+(5-i)*0.035,16.34+(5-i)*0.035,E.inOutQuint);
      // converge to logo dot position (in unrotated space it's close enough; grid flattens as it converges)
      const tx=mix(x,dot.x-TW/2,c), ty2=mix(y,dot.y-TH/2,c);
      const s=mix(1,0.08,c);
      css(el,{left:tx+'px',top:ty2+'px',opacity:a*(1-P(t,16.18+(5-i)*.03,16.36+(5-i)*.03)),
        transform:`translateZ(${(1-a)*(-900+i*60)}px) translateY(${(1-a)*(rowi-1)*120}px) scale(${s})`,borderRadius:mix(18,60,c)+'px'});
    }
    $('#gridIn').style.opacity=1;
    // logo
    const lw=$('#logoWrap'); vis(lw,t>16.1);
    const dIn=P(t,16.22,16.5,E.outBack);
    $('#lgDot').style.transform=`scale(${dIn}) rotate(${(1-P(t,16.22,16.55,E.outCubic))*-90}deg)`;
    const rv=P(t,16.36,16.95,E.outQuint);
    $('#lgR span').style.transform=`translateX(${(1-rv)*105}%)`;
    $('#lgI span').style.transform=`translateX(${(1-rv)*-105}%)`;
    const sh=P(t,16.95,17.6,E.inOutCubic);
    ['#lgR span','#lgI span'].forEach(s=>{const e=$(s);e.style.backgroundImage=`linear-gradient(100deg,#E9E9E6 ${mix(-40,120,sh)-18}%,#FFFFFF ${mix(-40,120,sh)}%,#E9E9E6 ${mix(-40,120,sh)+18}%)`;e.style.webkitBackgroundClip='text';e.style.color='transparent'});
    const tg=P(t,16.8,17.3,E.outCubic);
    css($('#tag'),{opacity:tg*(1-P(t,17.35,17.55)),letterSpacing:mix(12,6,tg)+'px'});
    // scene 6: logo docks to bottom
    const dk6=P(t,17.35,17.95,E.inOutQuint);
    $('#logo').style.transform=`translate(${LOGO.x}px,${mix(LOGO.y,1390-LOGO.h/2,dk6)}px) scale(${mix(1,0.44,dk6)})`;
  }

  /* ---------------- SCENE 6 (17.4–20) CTA ---------------- */
  const s6=t>=17.3; vis($('#s6'),s6);
  if(s6){
    document.querySelectorAll('#ctaH .ln>span').forEach((s,i)=>{const a=P(t,17.5+i*.09,18.1+i*.09,E.outQuint);s.style.transform=`translateY(${(1-a)*112}%)`});
    const fr=P(t,17.85,18.3,E.outCubic); css($('#free'),{opacity:fr,transform:`translateY(${(1-fr)*20}px)`});
    $('#free').querySelectorAll('i').forEach(i=>i.style.width=(70*fr)+'px');
    const wa=P(t,18.0,18.55,E.outBack); css($('#wa'),{opacity:P(t,18.0,18.2),transform:`translateY(${(1-wa)*40}px) scale(${mix(.94,1,wa)})`});
    [['#ring1',18.45],['#ring2',18.95]].forEach(([id,t0])=>{const k=((t-t0)%1.0+1)%1.0, on=t>t0;css($(id),{opacity:on?(1-k)*.7:0,transform:`scale(${1+k*.55})`})});
  }
}
window.render=render;

function init(){
  build();
  // logo metrics
  const lg=$('#logo'); lg.style.transformOrigin='50% 50%';
  const w=lg.offsetWidth,h=lg.offsetHeight, x=540-w/2, y=930-h/2;
  const dotEl=$('#lgDot');
  LOGO={x,y,h,dot:{x:x+dotEl.offsetLeft+22,y:y+dotEl.offsetTop+22}};
  $('#tag').style.top=(y+h+34)+'px';
  render(0);
}
window.ready=document.fonts.ready.then(()=>{init();return true;});

const qs=new URLSearchParams(location.search);
if(qs.has('t')) window.ready.then(()=>render(+qs.get('t')));
if(qs.has('play')) window.ready.then(()=>{const t0=performance.now();(function f(){render(((performance.now()-t0)/1000)%20);requestAnimationFrame(f)})()});
</script>
</body>
</html>
